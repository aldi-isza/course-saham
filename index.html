<!DOCTYPE html>
<html lang="id" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Stockbit Academy — Masterclass Analisis Saham (React & Vite)</title>
    <!-- Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Netlify Badge Suppression (SOP) -->
    <style>
      #nl-badge-frame,
      iframe[id*="nl-badge"],
      iframe[title*="Netlify"],
      [data-nl-ready],
      .nl-wrap,
      #nl-badge {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        clip-path: inset(100%) !important;
        width: 0 !important;
        height: 0 !important;
        z-index: -9999 !important;
        position: absolute !important;
        left: -9999px !important;
        bottom: -9999px !important;
      }
    </style>
    <script>
      (function() {
        function removeBadge() {
          var el = document.getElementById('nl-badge-frame') || document.querySelector('iframe[title*="Netlify"]');
          if (el) el.remove();
        }
        removeBadge();
        document.addEventListener('DOMContentLoaded', removeBadge);
        window.addEventListener('load', removeBadge);
        var obs = new MutationObserver(function() {
          removeBadge();
        });
        obs.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
  </head>
  <body class="min-h-screen bg-background text-foreground antialiased selection:bg-primary/20 selection:text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
